<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadIt</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body class="reader-body">
  <nav class="reader-nav">
    <a href="/" class="back-link" id="library-link">&larr; Library</a>
    <span id="book-title" class="book-title"></span>
    <div class="text-controls">
      <button id="text-smaller" class="text-btn" aria-label="Decrease text size">A&minus;</button>
      <span id="text-size-label" class="text-size-label">100%</span>
      <button id="text-larger" class="text-btn" aria-label="Increase text size">A+</button>
    </div>
  </nav>

  <div class="reader-container">
    <button id="prev" class="nav-btn nav-prev" aria-label="Previous page">&lsaquo;</button>
    <div id="viewer"></div>
    <button id="next" class="nav-btn nav-next" aria-label="Next page">&rsaquo;</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const filename = params.get('book');

    if (!filename) {
      location.href = '/';
    }

    function saveState(update) {
      fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(update)
      });
    }

    saveState({ lastBook: filename });

    document.getElementById('library-link').addEventListener('click', (e) => {
      e.preventDefault();
      saveState({ lastBook: null });
      location.href = '/';
    });

    const bookPath = '/books/' + encodeURIComponent(filename);
    const viewerEl = document.getElementById('viewer');

    Promise.all([
      fetch(bookPath).then(res => {
        if (!res.ok) throw new Error('Failed to fetch book: ' + res.status);
        return res.arrayBuffer();
      }),
      fetch('/api/state').then(r => r.json())
    ])
      .then(([buffer, state]) => {
        const book = ePub(buffer);
        const rendition = book.renderTo(viewerEl, {
          width: viewerEl.offsetWidth,
          height: viewerEl.offsetHeight,
          spread: 'none'
        });

        window.addEventListener('resize', () => {
          rendition.resize(viewerEl.offsetWidth, viewerEl.offsetHeight);
        });

        book.ready.then(() => {
          const savedCfi = state.positions[filename];
          return rendition.display(savedCfi || undefined);
        }).catch(err => console.error('Display error:', err));

        rendition.on('relocated', (location) => {
          saveState({ positions: { [filename]: location.start.cfi } });
        });

        book.loaded.metadata.then(meta => {
          document.getElementById('book-title').textContent = meta.title || filename.replace(/\.epub$/i, '');
          document.title = meta.title || 'ReadIt';
        });

        const sizes = [80, 90, 100, 110, 125, 150];
        let sizeIndex = sizes.indexOf(state.textSize || 100);
        if (sizeIndex === -1) sizeIndex = 2;

        function applyTextSize() {
          const pct = sizes[sizeIndex];
          rendition.themes.fontSize(pct + '%');
          document.getElementById('text-size-label').textContent = pct + '%';
          saveState({ textSize: pct });
        }

        applyTextSize();

        document.getElementById('text-smaller').addEventListener('click', () => {
          if (sizeIndex > 0) { sizeIndex--; applyTextSize(); }
        });
        document.getElementById('text-larger').addEventListener('click', () => {
          if (sizeIndex < sizes.length - 1) { sizeIndex++; applyTextSize(); }
        });

        document.getElementById('prev').addEventListener('click', () => rendition.prev());
        document.getElementById('next').addEventListener('click', () => rendition.next());

        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') rendition.prev();
          if (e.key === 'ArrowRight') rendition.next();
        });

        rendition.on('keydown', (e) => {
          if (e.key === 'ArrowLeft') rendition.prev();
          if (e.key === 'ArrowRight') rendition.next();
        });
      })
      .catch(err => console.error('Book load error:', err));
  </script>
</body>
</html>
