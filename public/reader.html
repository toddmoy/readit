<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadIt</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tailwind-setup.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body class="flex flex-col h-screen overflow-hidden">
  <nav class="flex items-center gap-4 px-4 h-12 border-b border-border shrink-0">
    <a href="/" class="inline-flex items-center text-sm font-medium text-muted-foreground transition-colors hover:text-foreground" id="library-link">
      <svg class="mr-1.5 h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Library
    </a>
    <span id="book-title" class="text-sm text-muted-foreground overflow-hidden text-ellipsis whitespace-nowrap flex-1"></span>
    <div class="flex items-center gap-1 shrink-0">
      <button id="text-smaller" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground h-8 w-8" aria-label="Decrease text size">
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
      </button>
      <span id="text-size-label" class="text-xs text-muted-foreground min-w-[36px] text-center tabular-nums">100%</span>
      <button id="text-larger" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground h-8 w-8" aria-label="Increase text size">
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </button>
    </div>
  </nav>

  <div class="flex-1 relative overflow-hidden">
    <button id="prev" class="absolute inset-y-0 left-0 w-16 bg-transparent border-none text-muted-foreground/30 text-4xl cursor-pointer z-10 transition-colors hover:text-muted-foreground hover:bg-background/50" aria-label="Previous page">&lsaquo;</button>
    <div id="viewer" class="absolute inset-y-0 left-1/2 -translate-x-1/2 w-full max-w-[38em] bg-white"></div>
    <button id="next" class="absolute inset-y-0 right-0 w-16 bg-transparent border-none text-muted-foreground/30 text-4xl cursor-pointer z-10 transition-colors hover:text-muted-foreground hover:bg-background/50" aria-label="Next page">&rsaquo;</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const filename = params.get('book');

    if (!filename) {
      location.href = '/';
    }

    function saveState(update) {
      fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(update)
      });
    }

    saveState({ lastBook: filename });

    document.getElementById('library-link').addEventListener('click', (e) => {
      e.preventDefault();
      saveState({ lastBook: null });
      location.href = '/';
    });

    const bookPath = '/books/' + encodeURIComponent(filename);
    const viewerEl = document.getElementById('viewer');

    Promise.all([
      fetch(bookPath).then(res => {
        if (!res.ok) throw new Error('Failed to fetch book: ' + res.status);
        return res.arrayBuffer();
      }),
      fetch('/api/state').then(r => r.json())
    ])
      .then(([buffer, state]) => {
        const book = ePub(buffer);
        const rendition = book.renderTo(viewerEl, {
          width: viewerEl.offsetWidth,
          height: viewerEl.offsetHeight,
          spread: 'none'
        });

        window.addEventListener('resize', () => {
          rendition.resize(viewerEl.offsetWidth, viewerEl.offsetHeight);
        });

        book.ready.then(() => {
          const savedCfi = state.positions[filename];
          return rendition.display(savedCfi || undefined);
        }).catch(err => console.error('Display error:', err));

        rendition.on('relocated', (location) => {
          saveState({ positions: { [filename]: location.start.cfi } });
        });

        book.loaded.metadata.then(meta => {
          document.getElementById('book-title').textContent = meta.title || filename.replace(/\.epub$/i, '');
          document.title = meta.title || 'ReadIt';
        });

        const sizes = [80, 90, 100, 110, 125, 150];
        let sizeIndex = sizes.indexOf(state.textSize || 100);
        if (sizeIndex === -1) sizeIndex = 2;

        function applyTextSize() {
          const pct = sizes[sizeIndex];
          rendition.themes.fontSize(pct + '%');
          document.getElementById('text-size-label').textContent = pct + '%';
          saveState({ textSize: pct });
        }

        applyTextSize();

        document.getElementById('text-smaller').addEventListener('click', () => {
          if (sizeIndex > 0) { sizeIndex--; applyTextSize(); }
        });
        document.getElementById('text-larger').addEventListener('click', () => {
          if (sizeIndex < sizes.length - 1) { sizeIndex++; applyTextSize(); }
        });

        document.getElementById('prev').addEventListener('click', () => rendition.prev());
        document.getElementById('next').addEventListener('click', () => rendition.next());

        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') rendition.prev();
          if (e.key === 'ArrowRight') rendition.next();
        });

        rendition.on('keydown', (e) => {
          if (e.key === 'ArrowLeft') rendition.prev();
          if (e.key === 'ArrowRight') rendition.next();
        });
      })
      .catch(err => console.error('Book load error:', err));
  </script>
</body>
</html>
