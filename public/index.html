<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadIt</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            card: { DEFAULT: 'var(--card)', foreground: 'var(--card-foreground)' },
            popover: { DEFAULT: 'var(--popover)', foreground: 'var(--popover-foreground)' },
            primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },
            secondary: { DEFAULT: 'var(--secondary)', foreground: 'var(--secondary-foreground)' },
            muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
            accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },
            destructive: { DEFAULT: 'var(--destructive)', foreground: 'var(--destructive-foreground)' },
            border: 'var(--border)',
            input: 'var(--input)',
            ring: 'var(--ring)',
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
        }
      }
    }
  </script>
</head>
<body class="min-h-screen">
  <div class="max-w-md mx-auto px-6 pt-20 pb-12">
    <h1 class="text-3xl font-bold tracking-tight text-foreground mb-1">ReadIt</h1>
    <p class="text-sm text-muted-foreground mb-10">Pick up where you left off.</p>
    <ul id="book-list" class="list-none space-y-1"></ul>
    <p id="empty" class="text-sm text-muted-foreground" hidden>
      No books found. Drop an <code class="relative rounded bg-muted px-[0.3rem] py-[0.2rem] font-mono text-sm">.epub</code>
      into the <code class="relative rounded bg-muted px-[0.3rem] py-[0.2rem] font-mono text-sm">books/</code> folder.
    </p>
  </div>

  <script>
    async function init() {
      const state = await fetch('/api/state').then(r => r.json());

      if (state.lastBook) {
        location.href = '/reader.html?book=' + encodeURIComponent(state.lastBook);
        return;
      }

      const res = await fetch('/api/books');
      const books = await res.json();
      const list = document.getElementById('book-list');
      const empty = document.getElementById('empty');

      if (books.length === 0) {
        empty.hidden = false;
        return;
      }

      books.forEach(filename => {
        const li = document.createElement('li');

        const a = document.createElement('a');
        a.href = '/reader.html?book=' + encodeURIComponent(filename);
        a.textContent = filename.replace(/\.epub$/i, '');
        a.className = 'flex items-center justify-between w-full rounded-lg px-3 py-2.5 text-sm font-medium text-foreground transition-colors hover:bg-accent hover:text-accent-foreground';

        if (state.positions[filename]) {
          const badge = document.createElement('span');
          badge.className = 'inline-flex items-center rounded-full border border-transparent bg-secondary px-2.5 py-0.5 text-xs font-semibold text-secondary-foreground';
          badge.textContent = 'Continue';
          a.appendChild(badge);
        }

        li.appendChild(a);
        list.appendChild(li);
      });
    }

    init();
  </script>
</body>
</html>
