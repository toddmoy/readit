<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadIt</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tailwind-setup.js"></script>
</head>
<body class="min-h-screen">
  <div class="max-w-4xl mx-auto px-6 pt-16 pb-12">
    <div id="book-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    <p id="empty" class="text-sm text-muted-foreground" hidden>
      No books found. Drop an <code class="relative rounded bg-muted px-[0.3rem] py-[0.2rem] font-mono text-sm">.epub</code>
      into the <code class="relative rounded bg-muted px-[0.3rem] py-[0.2rem] font-mono text-sm">books/</code> folder.
    </p>
  </div>

  <script src="/cards.js"></script>
  <script>
    async function init() {
      const state = await fetch('/api/state').then(r => r.json());

      if (state.lastBook) {
        location.href = '/reader.html?book=' + encodeURIComponent(state.lastBook);
        return;
      }

      const res = await fetch('/api/books');
      const books = await res.json();
      const grid = document.getElementById('book-grid');
      const empty = document.getElementById('empty');

      if (books.length === 0) {
        empty.hidden = false;
        return;
      }

      books.forEach((filename, i) => {
        const card = BookCards.create(filename, i, !!state.positions[filename]);
        grid.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
